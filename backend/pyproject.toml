[project]
name = "ventureiq-backend"
version = "0.1.0"
description = "VentureIQ - Agentic AI and RAG-powered startup investment platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "shap>=0.46",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet (live lookups)",
    "registry: needs backend/registry.db (run scripts/import_mca_registry.py)",
]
