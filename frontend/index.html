<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="VentureIQ — verified, explainable intelligence on private companies." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VentureIQ — Startup Investment Intelligence</title>
    <!-- Resolve the theme before first paint so there is no light/dark flash. -->
    <script>
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("viq.theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var t = dark ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
